name: Deploy

on:
  push:
    branches: [staging, production]
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target
        type: choice
        required: true
        options: [staging, production]

concurrency:
  group: deploy-${{ inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || github.ref_name }}
      url: https://pm-tool-frontend-${{ inputs.environment || github.ref_name }}.web-app-dev.workers.dev
    env:
      TARGET: ${{ inputs.environment || github.ref_name }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check environment configuration
        run: test -n "$VITE_API_BASE_URL" || { echo "VITE_API_BASE_URL is not set"; exit 1; }
      - run: pnpm exec turbo run lint typecheck test
      - name: Build frontend
        run: pnpm --filter frontend run "build:$TARGET"
      - name: Deploy backend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/backend
          command: |
            d1 migrations apply DB --remote --env ${{ env.TARGET }}
            deploy --env ${{ env.TARGET }}
      - name: Deploy frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/frontend
          command: deploy --env ${{ env.TARGET }}
