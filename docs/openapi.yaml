          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IpBanned'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/invitations/{invitationId}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      operationId: acceptInvitation
      summary: 招待を受諾してプロジェクトに参加する
      description: |
        ログイン中ユーザーのメールアドレス宛ての招待だけ受諾できる。パスコードが一致すると招待のロールでメンバーに追加し、招待を削除する。
        既にメンバーの場合は既存のロールを維持する。パスコードを 10 回間違えると以後は 423 になる（再招待でリセット）。
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: 参加したプロジェクト（`role` は参加後の自分のロール）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: |
            - `validation_error`: 入力が不正
            - `invalid_passcode`: パスコードが一致しない（失敗回数を加算する）
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
              examples:
                invalidPasscode:
                  value: { error: invalid_passcode }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IpBanned'
        '404':
          description: 招待が存在しない、または自分宛てでない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: not_found }
        '410':
          description: 招待の有効期限切れ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: expired }
        '423':
          description: パスコードの失敗回数が上限（10 回）に達している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: locked }
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/me:
    patch:
      operationId: updateMe
      summary: 表示名を変更する
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 更新後のユーザー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IpBanned'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: deleteMe
      summary: 退会する
      description: |
        自分以外のメンバーがいるオーナープロジェクトがあると退会できない（409。先にオーナーを移すかメンバーを外す）。
        退会すると、自分だけのオーナープロジェクトを削除し、全プロジェクトのメンバーから外れ、担当タスクを担当者なしにし、
        アバターを削除する。ユーザー行は削除せず匿名化する（表示名は `退会したユーザー`）。現在のセッションを破棄し `session_id` Cookie を削除する。
      tags: [me]
      responses:
        '204':
          description: 退会完了
          headers:
            Set-Cookie:
              description: '`session_id` の削除'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IpBanned'
        '409':
          description: 自分以外のメンバーがいるオーナープロジェクトがある
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionBlocked'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/me/tasks:
    get:
      operationId: listMyTasks
      summary: 自分が担当している未完了タスクの一覧を取得する
      description: |
        自分が担当者で `status` が `open`、タスクが未アーカイブ、所属プロジェクトが進行中、かつ自分がそのプロジェクトのメンバーであるタスク。
        `endDate` の昇順（`null` は最後）、同順位は作成日時の昇順。
      tags: [me]
      responses:
        '200':
          description: 担当タスク一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IpBanned'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/me/avatar:
    put:
      operationId: uploadAvatar
      summary: アバター画像をアップロードする
      description: |
        `multipart/form-data` の `file` フィールドで送る。PNG / JPEG / WebP、100 KiB 以下、幅・高さとも 256px 以下。
        画像ヘッダーから寸法を読むため、ヘッダーが読めない画像も `image_too_large` になる。
        アップロードごとに新しい URL になり、以前の画像は削除される。
      tags: [me]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadAvatarRequest'
            encoding:
              file:
                contentType: image/png, image/jpeg, image/webp
      responses:
        '200':
          description: 更新後のユーザー（`avatarUrl` が新しい画像を指す）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '400':
          description: |
            - `file_required`: `file` フィールドが無い、またはファイルでない
            - `unsupported_media_type`: ファイルの Content-Type が PNG / JPEG / WebP 以外
            - `image_too_large`: 幅か高さが 256px を超える、または画像ヘッダーから寸法を読めない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                fileRequired:
                  value: { error: file_required }
                unsupportedMediaType:
                  value: { error: unsupported_media_type }
                imageTooLarge:
                  value: { error: image_too_large }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IpBanned'
        '413':
          description: ファイルが 100 KiB を超える、またはリクエストボディ全体が 100 KiB + 16 KiB を超える
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: payload_too_large }
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: removeAvatar
      summary: アバター画像を削除する
      tags: [me]
      responses:
        '200':
          description: 更新後のユーザー（`avatarUrl` は `null`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IpBanned'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/avatars/{userId}/{fileId}:
    get:
      operationId: getAvatar
      summary: アバター画像を取得する
      description: |
        ユーザー情報の `avatarUrl`（`/api/avatars/{userId}/{fileId}`）が指す画像を返す。ログインしていれば誰のアバターでも取得できる。
        URL ごとに内容が不変なので `Cache-Control: private, max-age=31536000, immutable` を付ける。
      tags: [avatars]
      parameters:
        - name: userId
          in: path
          required: true
          description: アバターの持ち主のユーザー ID
          schema:
            type: string
        - name: fileId
          in: path
          required: true
          description: アップロードごとに発行されるファイル ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 画像本体。Content-Type はアップロード時のもの（不明なら `application/octet-stream`）。
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, max-age=31536000, immutable
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IpBanned'
        '404':
          description: 画像が存在しない（差し替え・削除済みを含む）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: not_found }
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: Google OAuth ログイン成功時に発行されるセッション Cookie（HttpOnly / Secure / SameSite=Lax、7 日）。

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: プロジェクト ID
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      description: タスクの ID
      schema:
        type: string
    CommentId:
      name: commentId
      in: path
      required: true
      description: コメント ID
      schema:
        type: string
    LabelId:
      name: labelId
      in: path
      required: true
      description: ラベルの ID
      schema:
        type: string
    ManualPageId:
      name: manualId
      in: path
      required: true
      description: マニュアルのページ ID
      schema:
        type: string
    MemberUserId:
      name: userId
      in: path
      required: true
      description: 対象メンバーのユーザー ID
      schema:
        type: string
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: 招待 ID
      schema:
        type: string

  responses:
    ValidationError:
      description: リクエストのバリデーションに失敗した
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: 未ログイン、またはセッションが無効（期限切れ・退会済み）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: unauthorized }
    NotFound:
      description: 対象が存在しない、またはプロジェクトのメンバーでない（存在を隠すため 404 にしている）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: not_found }
    IpBanned:
      description: 送信元 IP が永久 BAN されている
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: ip_banned }
    ForbiddenOrIpBanned:
      description: |
        - `forbidden`: プロジェクトのメンバーだが、この操作に必要なロール（またはオーナー権限）が無い
        - `ip_banned`: 送信元 IP が永久 BAN されている
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value: { error: forbidden }
            ipBanned:
              value: { error: ip_banned }
    LabelNameTaken:
      description: 同じ名前のラベルがこのプロジェクトに既にある
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: label_name_taken }
    RateLimited:
      description: レートリミット超過、または一時 BAN 中
      headers:
        Retry-After:
          description: 再試行できるまでの秒数
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: rate_limited }

  schemas:
    ProjectRole:
      type: string
      enum: [admin, staff, substaff]
      description: '`admin`: 全操作 / `staff`: 閲覧と編集 / `substaff`: 閲覧のみ'
    TaskStatus:
      type: string
      enum: [open, done]
    LabelColor:
      type: string
      pattern: '^#[0-9a-fA-F]{6}$'
      description: ラベルの表示色（`#rrggbb`）。大文字で送っても小文字に正規化して保存する。
      example: '#e5484d'
    TaskLabel:
      type: object
      required: [id, projectId, name, color, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
        name:
          type: string
        color:
          $ref: '#/components/schemas/LabelColor'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    CalendarDate:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: 暦日（YYYY-MM-DD、タイムゾーンなし）
      examples: ['2026-09-28']
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601（UTC、ミリ秒付き）
    AvatarUrl:
      type: [string, 'null']
      description: アバター画像のパス（`/api/avatars/{userId}/{fileId}`、API のオリジンからの相対パス）。未設定なら `null`。
      examples:
        ['/api/avatars/0b9e1c1e-9d3b-4c52-8f7e-3d6a2f1c0a11/5f0c8e2a-7c1d-4b8e-9a3f-2d1e0c9b8a76']

    HealthCheckResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    AuthUser:
      type: object
      description: ログイン中のユーザー
      required: [id, email, name, avatarUrl]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          $ref: '#/components/schemas/AvatarUrl'
    UserSummary:
      type: object
      description: 他のリソースに埋め込まれるユーザー情報。退会済みユーザーは name が `退会したユーザー`、email が `deleted-{id}@deleted.invalid` になる。
      required: [id, email, name, avatarUrl]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        avatarUrl:
          $ref: '#/components/schemas/AvatarUrl'
    Project:
      type: object
      required: [id, name, description, ownerId, role, archivedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          $ref: '#/components/schemas/RichTextDoc'
        ownerId:
          type: string
        role:
          allOf:
            - $ref: '#/components/schemas/ProjectRole'
          description: リクエストしたユーザー自身のロール
        archivedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: 完了にした日時。`null` なら進行中
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ProjectMember:
      type: object
      required: [userId, email, name, avatarUrl, role, isOwner, createdAt]
      properties:
        userId:
          type: string
        email:
          type: string
        name:
          type: string
        avatarUrl:
          $ref: '#/components/schemas/AvatarUrl'
        role:
          $ref: '#/components/schemas/ProjectRole'
        isOwner:
          type: boolean
        createdAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: メンバーになった日時
    ProjectInvitation:
      type: object
      required: [id, projectId, projectName, email, role, invitedBy, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
        projectName:
          type: string
        email:
          type: string
          format: email
          description: 小文字に正規化済み
        role:
          allOf:
            - $ref: '#/components/schemas/ProjectRole'
          description: 受諾時に付与されるロール
        invitedBy:
          $ref: '#/components/schemas/UserSummary'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Task:
      type: object
      required:
        [
          id,
          projectId,
          title,
          description,
          descriptionEditedAt,
          status,
          assignee,
          startDate,
          endDate,
          label,
          archivedAt,
          createdBy,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
        title:
          type: string
        description:
          $ref: '#/components/schemas/RichTextDoc'
        descriptionEditedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: 本文が作成後に編集されたことがある場合の最終編集日時。状態・担当・日付・ラベルの変更では更新されない。未編集なら `null`
        status:
          $ref: '#/components/schemas/TaskStatus'
        assignee:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        startDate:
          oneOf:
            - $ref: '#/components/schemas/CalendarDate'
            - type: 'null'
          description: 開始日。`endDate` と両方 `null` か両方あり
        endDate:
          oneOf:
            - $ref: '#/components/schemas/CalendarDate'
            - type: 'null'
          description: 終了日。`startDate` と両方 `null` か両方あり
        label:
          oneOf:
            - $ref: '#/components/schemas/TaskLabel'
            - type: 'null'
          description: 付いているラベル。なければ `null`
        archivedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: アーカイブした日時。`null` なら未アーカイブ
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    MyTask:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          required: [project]
          properties:
            project:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
              description: タスクが属するプロジェクト
    TaskComment:
      type: object
      required: [id, taskId, author, body, createdAt, editedAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
        author:
          $ref: '#/components/schemas/UserSummary'
        body:
          $ref: '#/components/schemas/RichTextDoc'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        editedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: 投稿後に編集した最終日時。未編集なら `null`
    ProjectComment:
      allOf:
        - $ref: '#/components/schemas/TaskComment'
        - type: object
          required: [task]
          properties:
            task:
              type: object
              required: [id, title]
              properties:
                id:
                  type: string
                title:
                  type: string
    RichTextMark:
      type: object
      required: [type]
      properties:
        type:
          type: string
        attrs:
          type: object
          additionalProperties: true
    RichTextNode:
      type: object
      required: [type]
      properties:
        type:
          type: string
        attrs:
          type: object
          additionalProperties: true
        content:
          type: array
          items:
            $ref: '#/components/schemas/RichTextNode'
        marks:
          type: array
          items:
            $ref: '#/components/schemas/RichTextMark'
        text:
          type: string
    RichTextDoc:
      type: object
      description: |
        Tiptap（ProseMirror）の JSON ドキュメント。サーバーで以下のホワイトリスト検証を行い、違反は `400 validation_error` になる。
        - ノード: `doc` / `paragraph` / `heading`（`attrs.level` は 1〜3） / `bulletList` / `orderedList`（`attrs.start` は任意の数値） /
          `listItem` / `blockquote` / `codeBlock` / `hardBreak` / `image`（`attrs.src` 必須、`attrs.alt` 任意） / `text`（`text` は空でない文字列）
        - マーク: `bold` / `italic` / `strike` / `code` / `link`（`attrs.href` 必須、`http://` か `https://` で始まる。`target` / `rel` は保存時に落とす）
        - 子ノードは StarterKit の既定スキーマに従う（`doc` / `blockquote` / `listItem` の子はブロック、リストの子は `listItem`、
          `paragraph` / `heading` の子は `text` / `hardBreak` / `image`、`codeBlock` の子はマークなしの `text` のみ）
        - 未知のノード・マーク・トップレベルのキーは拒否する。未知の attrs と値が `null` の attrs は保存時に落とす。ネストの深さは 20 まで
        - `JSON.stringify` した UTF-8 バイト長が 64 KiB（65536 バイト）以下
        - `image` の `attrs.src` は同一プロジェクトの添付 URL（`/api/projects/{projectId}/attachments/{id}`）のみ。`data:` URL や外部 URL は拒否する
      required: [type, content]
      properties:
        type:
          type: string
          enum: [doc]
        content:
          type: array
          items:
            $ref: '#/components/schemas/RichTextNode'
      examples:
        - type: doc
          content:
            - type: paragraph
              content:
                - type: text
                  text: 本文
    Attachment:
      type: object
      required: [id, url, contentType, size, width, height, createdAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: 画像のパス（`/api/projects/{projectId}/attachments/{id}`、API のオリジンからの相対パス）
        contentType:
          type: string
          examples: [image/png]
        size:
          type: integer
          description: バイト数
        width:
          type: integer
        height:
          type: integer
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    ManualPageSummary:
      type: object
      required: [id, projectId, title, createdBy, createdAt, updatedAt]
