      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/ProjectRole'
    CreateInvitationRequest:
      type: object
      required: [email, role, passcode]
      properties:
        email:
          type: string
          format: email
          description: 前後の空白を除去し小文字化してから検証・保存する
        role:
          $ref: '#/components/schemas/ProjectRole'
        passcode:
          type: string
          minLength: 4
          maxLength: 32
          description: 受諾時に必要なパスコード。招待者が招待先に別経路で伝える。
    AcceptInvitationRequest:
      type: object
