  /api/projects/{projectId}/attachments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: uploadAttachment
      summary: 画像添付をアップロードする
      description: |
        `admin` / `staff` のみ。`multipart/form-data` の `file` フィールドで送る。PNG / JPEG / WebP、500 KiB 以下、幅・高さとも 2048px 以下。
        画像ヘッダーから寸法を読むため、ヘッダーが読めない画像も `image_too_large` になる。
        返る `url`（`/api/projects/{projectId}/attachments/{id}`）をリッチテキストの `image` ノードの `attrs.src` に使う。
      tags: [attachments]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadAttachmentRequest'
            encoding:
              file:
                contentType: image/png, image/jpeg, image/webp
      responses:
        '201':
          description: アップロードした添付
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          description: |
            - `file_required`: `file` フィールドが無い、またはファイルでない
            - `unsupported_media_type`: ファイルの Content-Type が PNG / JPEG / WebP 以外
            - `image_too_large`: 幅か高さが 2048px を超える、または画像ヘッダーから寸法を読めない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                fileRequired:
                  value: { error: file_required }
                unsupportedMediaType:
                  value: { error: unsupported_media_type }
                imageTooLarge:
                  value: { error: image_too_large }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrIpBanned'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: ファイルが 500 KiB を超える
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: payload_too_large }
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/projects/{projectId}/attachments/{fileId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: fileId
        in: path
        required: true
        description: 添付 ID（`Attachment.id`）
        schema:
          type: string
          format: uuid
    get:
      operationId: getAttachment
      summary: 画像添付を取得する
      description: |
        `Attachment.url` が指す画像を返す。プロジェクトのメンバー（全ロール）のみ取得できる。
        URL ごとに内容が不変なので `Cache-Control: private, max-age=31536000, immutable` を付ける。
      tags: [files]
      responses:
        '200':
          description: 画像本体。Content-Type はアップロード時のもの。
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, max-age=31536000, immutable
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IpBanned'
        '404':
          description: プロジェクトのメンバーでない、または添付がこのプロジェクトに存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: not_found }
        '429':
          $ref: '#/components/responses/RateLimited'

