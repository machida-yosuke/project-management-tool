          type: string
          minLength: 1
          maxLength: 200
          description: 前後の空白を除去してから長さを検証・保存する
        description:
          type: string
          maxLength: 4000
        status:
          $ref: '#/components/schemas/TaskStatus'
        assigneeId:
          type: [string, 'null']
          description: 担当者のユーザー ID（プロジェクトのメンバーであること）。`null` で担当を外す。
        startDate:
          type: [string, 'null']
          format: date
          description: '開始日（YYYY-MM-DD）。両方指定するか両方省略/`null` にする。`startDate <= endDate`。片方だけ、または逆転は `400 {error: invalid_date_range}`。PATCH では `null` でクリア、省略で変更なし。'
        endDate:
          type: [string, 'null']
          format: date
          description: '終了日（YYYY-MM-DD）。両方指定するか両方省略/`null` にする。`startDate <= endDate`。片方だけ、または逆転は `400 {error: invalid_date_range}`。PATCH では `null` でクリア、省略で変更なし。'
        color:
          $ref: '#/components/schemas/TaskColor'
    CreateCommentRequest:
