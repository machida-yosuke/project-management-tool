        startDate:
          type: [string, 'null']
          format: date
          description: '開始日（YYYY-MM-DD）。両方指定するか両方省略/`null` にする。`startDate <= endDate`。片方だけ、または逆転は `400 {error: invalid_date_range}`。PATCH では `null` でクリア、省略で変更なし。'
        endDate:
          type: [string, 'null']
          format: date
          description: '終了日（YYYY-MM-DD）。両方指定するか両方省略/`null` にする。`startDate <= endDate`。片方だけ、または逆転は `400 {error: invalid_date_range}`。PATCH では `null` でクリア、省略で変更なし。'
        color:
